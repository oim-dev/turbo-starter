# Docker Compose для локальной разработки
# PostgreSQL запускается по умолчанию; профили storage и images добавляют сервисы.
# Backend и Frontend запускаются отдельно в dev режиме

name: turbo-starter-dev

services:
  # PostgreSQL
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5544}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-default-db}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 5

  # S3-compatible object storage
  minio:
    profiles: [storage, images]
    image: turbo-starter-minio:dev
    build:
      context: .
      dockerfile: minio.Dockerfile
    pull_policy: build
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:${S3_PORT:-9000}:9000"
      - "127.0.0.1:${S3_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-user}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-password}
      MINIO_SITE_REGION: ${S3_REGION:-us-east-1}
      # В закреплённой версии MinIO CORS настраивается на уровне сервера.
      MINIO_API_CORS_ALLOW_ORIGIN: ${S3_CORS_ALLOW_ORIGIN:-http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001}
    volumes:
      - minio_dev_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Идемпотентно создаёт приватный bucket.
  minio-init:
    profiles: [storage, images]
    image: turbo-starter-minio-init:dev
    build:
      context: .
      dockerfile: minio.Dockerfile
    pull_policy: build
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-user}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-password}
      S3_BUCKET: ${S3_BUCKET:-default-bucket}
    entrypoint: >-
      /bin/sh -c '
      set -e;
      mc alias set local http://minio:9000 "$${S3_ACCESS_KEY}" "$${S3_SECRET_KEY}";
      mc mb --ignore-existing "local/$${S3_BUCKET}";
      mc anonymous set none "local/$${S3_BUCKET}";
      if ! mc ilm rule ls --json "local/$${S3_BUCKET}" | grep -F "files/staging/" >/dev/null; then
        mc ilm rule add --prefix "files/staging/" --expire-days 1 --noncurrent-expire-days 1 "local/$${S3_BUCKET}";
      fi;
      '
    restart: "no"

  rabbitmq:
    profiles: [images]
    image: rabbitmq:4.3.6-management-alpine@sha256:3ef7f7e89fed709a78f79b8b5f4e30e1312a1d4089da752e23595566d9d61a95
    hostname: rabbitmq
    restart: unless-stopped
    cpus: "1.0"
    mem_limit: 768m
    pids_limit: 256
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-image}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-image-password}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-images}
    volumes:
      - rabbitmq_dev_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping && rabbitmq-diagnostics -q check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # Вызывается только host-воркером; original скачивается по подписанному S3 URL.
  imgproxy:
    profiles: [images]
    image: darthsim/imgproxy@sha256:10e03149338f22e27c561b598f12da90109492a401d9afe5811a000cacdbe5c8
    restart: unless-stopped
    cpus: "2.0"
    mem_limit: 1g
    pids_limit: 256
    depends_on:
      minio-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${IMGPROXY_PORT:-18080}:8080"
    environment:
      IMGPROXY_KEY: ${IMGPROXY_KEY:-1111111111111111111111111111111111111111111111111111111111111111}
      IMGPROXY_SALT: ${IMGPROXY_SALT:-2222222222222222222222222222222222222222222222222222222222222222}
      IMGPROXY_WORKERS: ${IMGPROXY_WORKERS:-2}
      IMGPROXY_REQUESTS_QUEUE_SIZE: "8"
      IMGPROXY_MAX_SRC_RESOLUTION: ${IMGPROXY_MAX_SRC_RESOLUTION:-40}
      IMGPROXY_DOWNLOAD_TIMEOUT: "30"
      IMGPROXY_ALLOWED_SOURCES: http://minio:9000/${S3_BUCKET:-default-bucket}/
      IMGPROXY_ALLOW_PRIVATE_SOURCE_ADDRESSES: "true"
      IMGPROXY_STRIP_METADATA: "true"
      IMGPROXY_AUTO_ROTATE: "true"
      IMGPROXY_PNG_QUANTIZE: "false"
      IMGPROXY_ENABLE_DEBUG_HEADERS: "true"
    healthcheck:
      test: ["CMD", "imgproxy", "health"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_dev_data:
  minio_dev_data:
  rabbitmq_dev_data:
