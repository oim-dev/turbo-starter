name: template-monorepo-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-database-environment: &database-environment
  DATABASE_URL: postgresql://${POSTGRES_USER:-demo}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-demo}

x-api-environment: &api-environment
  <<: *database-environment
  NODE_ENV: production
  NODE_OPTIONS: --max-old-space-size=192
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_ENDPOINT: https://api-demo-app.gromlab.ru
  S3_REGION: us-east-1
  # Имя бакета также используется в Caddyfile и minio-policy.json.
  S3_BUCKET: demo-media
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
  S3_FORCE_PATH_STYLE: "true"

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${CADDY_BIND_ADDRESS:-0.0.0.0}:${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_BIND_ADDRESS:-0.0.0.0}:${CADDY_HTTPS_PORT:-443}:443"
      - "${CADDY_BIND_ADDRESS:-0.0.0.0}:${CADDY_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ${CADDY_CONFIG_FILE:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      web:
        ipv4_address: ${CADDY_IP:-172.30.88.2}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:2019/config/]
      interval: 30s
      timeout: 5s
      retries: 5
    logging: *logging

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    command: [postgres, -c, shared_buffers=64MB, -c, max_connections=50]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-demo}
      POSTGRES_DB: ${POSTGRES_DB:-demo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [private]
    healthcheck:
      test:
        [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *logging

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      MINIO_BROWSER: "off"
      GOMEMLIMIT: 256MiB
    volumes:
      - minio_data:/data
    networks:
      private:
      web:
        aliases: [demo-s3]
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:9000/minio/health/live]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *logging

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    profiles: [tools]
    restart: "no"
    entrypoint: [/bin/sh, /scripts/init-minio.sh]
    environment:
      MC_CONFIG_DIR: /tmp/mc
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
    volumes:
      - ./init-minio.sh:/scripts/init-minio.sh:ro
      - ./minio-policy.json:/scripts/minio-policy.json:ro
    networks: [private]
    depends_on:
      minio:
        condition: service_healthy
    logging: *logging

  migrations:
    image: ${IMAGE_PREFIX:?Set IMAGE_PREFIX}/migrations:${IMAGE_TAG:?Set IMAGE_TAG}
    profiles: [tools]
    restart: "no"
    init: true
    environment: *database-environment
    networks: [private]
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  bootstrap-admin:
    image: ${IMAGE_PREFIX:?Set IMAGE_PREFIX}/migrations:${IMAGE_TAG:?Set IMAGE_TAG}
    profiles: [tools]
    restart: "no"
    init: true
    command: [./node_modules/.bin/ts-node, src/cli/seed-admin.ts]
    environment:
      <<: *database-environment
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Set BOOTSTRAP_ADMIN_PASSWORD}
    networks: [private]
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  catalog-seed:
    image: ${IMAGE_PREFIX:?Set IMAGE_PREFIX}/migrations:${IMAGE_TAG:?Set IMAGE_TAG}
    profiles: [tools]
    restart: "no"
    init: true
    command: [./node_modules/.bin/ts-node, src/cli/seed-catalog.ts]
    environment:
      <<: *api-environment
      NODE_OPTIONS: --max-old-space-size=512
      CATALOG_OWNER_PASSWORD: ${CATALOG_OWNER_PASSWORD:?Set CATALOG_OWNER_PASSWORD}
    networks: [private]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    logging: *logging

  client-api:
    image: ${IMAGE_PREFIX:?Set IMAGE_PREFIX}/backend:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      <<: *api-environment
      # Ключ провайдера остаётся только в Client API; в образ и frontend он не попадает.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4.1-mini}
      OPENROUTER_VISION_MODEL: ${OPENROUTER_VISION_MODEL:-openai/gpt-4.1}
      # Исходящий HTTPS Client API через установленный на хосте GOST (Node.js 24).
      NODE_USE_ENV_PROXY: ${CLIENT_USE_ENV_PROXY:-0}
      HTTPS_PROXY: ${CLIENT_HTTPS_PROXY:-}
      NO_PROXY: ${CLIENT_NO_PROXY:-localhost,127.0.0.1,::1,client-api,admin-api,minio,postgres,web-app}
      CLIENT_JWT_SECRET: ${CLIENT_JWT_SECRET:?Set CLIENT_JWT_SECRET}
      CLIENT_TRUSTED_PROXIES: ${CADDY_IP:-172.30.88.2}/32
      CLIENT_COOKIE_SAME_SITE: lax
      CLIENT_SWAGGER_ENABLED: "true"
    networks:
      private:
      web:
        aliases: [demo-client-api]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3001/categories', {signal: AbortSignal.timeout(3000)}).then(r => process.exit(r.status === 200 ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5
    logging: *logging

  admin-api:
    image: ${IMAGE_PREFIX:?Set IMAGE_PREFIX}/backend:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    command: [node, dist/admin-api/main.js]
    environment:
      <<: *api-environment
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?Set ADMIN_JWT_SECRET}
      ADMIN_TRUSTED_PROXIES: ${CADDY_IP:-172.30.88.2}/32
      ADMIN_COOKIE_SAME_SITE: lax
      ADMIN_SWAGGER_ENABLED: "true"
    networks:
      private:
      web:
        aliases: [demo-admin-api]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3002/auth/me', {signal: AbortSignal.timeout(3000)}).then(r => process.exit(r.status === 401 ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5
    logging: *logging

  admin:
    image: ${IMAGE_PREFIX:?Set IMAGE_PREFIX}/admin:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    networks:
      web:
        aliases: [demo-admin]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/]
      interval: 30s
      timeout: 5s
      retries: 5
    logging: *logging

  web-app:
    image: ${IMAGE_PREFIX:?Set IMAGE_PREFIX}/web-app:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      CLIENT_API_INTERNAL_URL: http://client-api:3001
      NODE_OPTIONS: --max-old-space-size=256
    networks:
      private:
      web:
        aliases: [demo-web-app]
    depends_on:
      client-api:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3005/about', {signal: AbortSignal.timeout(3000)}).then(r => process.exit(r.status === 200 ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5
    logging: *logging

volumes:
  postgres_data:
  minio_data:
  caddy_data:
  caddy_config:

networks:
  private:
    internal: true
  web:
    # Стабильный IP ingress позволяет API доверять только этому proxy.
    ipam:
      config:
        - subnet: ${CADDY_SUBNET:-172.30.88.0/24}
          # Динамические адреса не занимают закреплённый за Caddy адрес .2.
          ip_range: ${CADDY_DYNAMIC_RANGE:-172.30.88.128/25}
