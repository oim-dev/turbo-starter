# Источник — корень Git-репозитория; Compose path — docker-compose.yml.
# Домен Dokploy направляется только на gateway:8080.

x-service: &service
  restart: unless-stopped
  networks:
    - app
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "3"

x-database-environment: &database-environment
  DOTENV_CONFIG_PATH: /dev/null
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER:-app}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB:-app}

x-backend: &backend
  <<: *service
  build:
    context: .
    dockerfile: apps/backend/Dockerfile
    target: runtime
  init: true
  stop_grace_period: 40s
  environment:
    <<: *database-environment
    NODE_ENV: production
    CLIENT_API_HOST: 0.0.0.0
    CLIENT_API_PORT: "4000"
    ADMIN_API_HOST: 0.0.0.0
    ADMIN_API_PORT: "4001"
    CLIENT_JWT_SECRET: ${CLIENT_JWT_SECRET:?Set CLIENT_JWT_SECRET}
    ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?Set ADMIN_JWT_SECRET}
    BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Set BOOTSTRAP_ADMIN_PASSWORD}
    CLIENT_SWAGGER_ENABLED: "false"
    ADMIN_SWAGGER_ENABLED: "false"
    S3_ENDPOINT: ${PUBLIC_URL:?Set PUBLIC_URL}
    S3_INTERNAL_ENDPOINT: http://minio:9000
    S3_REGION: ${S3_REGION:-us-east-1}
    S3_BUCKET: ${S3_BUCKET:-storage}
    S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
    S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
    FILE_PUBLIC_BASE_URL: ${PUBLIC_URL:?Set PUBLIC_URL}
    IMAGE_PUBLIC_BASE_URL: ${PUBLIC_URL:?Set PUBLIC_URL}
    RABBITMQ_URL: amqp://${RABBITMQ_USER:-images}:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}@rabbitmq:5672/images
    IMGPROXY_URL: http://imgproxy:8080
    IMGPROXY_KEY: ${IMGPROXY_KEY:?Set IMGPROXY_KEY}
    IMGPROXY_SALT: ${IMGPROXY_SALT:?Set IMGPROXY_SALT}
    IMAGE_MAX_UPLOAD_BYTES: ${IMAGE_MAX_UPLOAD_BYTES:-20971520}
    IMAGE_MAX_SOURCE_PIXELS: ${IMAGE_MAX_SOURCE_PIXELS:-40000000}
    IMAGE_WORKER_CONCURRENCY: ${IMAGE_WORKER_CONCURRENCY:-2}
  depends_on:
    migrations:
      condition: service_completed_successfully
    minio-init:
      condition: service_completed_successfully
    rabbitmq:
      condition: service_healthy

services:
  gateway:
    <<: *service
    build:
      context: .
      dockerfile: infra/dokploy/gateway.Dockerfile
    environment:
      S3_BUCKET: ${S3_BUCKET:-storage}
    expose:
      - "8080"
    depends_on:
      web:
        condition: service_healthy
      client-api:
        condition: service_healthy
      admin-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    <<: *service
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_CLIENT_API_URL: /api
    init: true
    environment:
      CLIENT_API_INTERNAL_URL: http://client-api:4000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  client-api:
    <<: *backend
    command: ["node", "dist/client-api/main.js"]
    healthcheck:
      # Закрытый профиль без Bearer должен отвечать 401 после старта Nest.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/users/me').then(r=>process.exit(r.status===401?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  admin-api:
    <<: *backend
    command: ["node", "dist/admin-api/main.js"]
    healthcheck:
      # Этот публичный endpoint проверяет также чтение настроек из БД.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4001/auth/providers').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  image-worker:
    <<: *backend
    command: ["node", "dist/image-worker/main.js"]
    depends_on:
      migrations:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      imgproxy:
        condition: service_healthy
    stop_grace_period: 2m

  migrations:
    <<: *service
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: migrations
    restart: "no"
    init: true
    environment: *database-environment
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    <<: *service
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    <<: *service
    build:
      context: ./infra/dokploy
      dockerfile: minio.Dockerfile
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
      MINIO_SITE_REGION: ${S3_REGION:-us-east-1}
      MINIO_API_CORS_ALLOW_ORIGIN: ${PUBLIC_URL:?Set PUBLIC_URL}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    <<: *service
    build:
      context: ./infra/dokploy
      dockerfile: minio.Dockerfile
    restart: "no"
    entrypoint: ["/bin/sh", "/usr/local/bin/minio-init.sh"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-storage}
    depends_on:
      minio:
        condition: service_healthy

  rabbitmq:
    <<: *service
    image: rabbitmq:4.3.6-management-alpine@sha256:3ef7f7e89fed709a78f79b8b5f4e30e1312a1d4089da752e23595566d9d61a95
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-images}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: images
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping && rabbitmq-diagnostics -q check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  imgproxy:
    <<: *service
    image: darthsim/imgproxy@sha256:10e03149338f22e27c561b598f12da90109492a401d9afe5811a000cacdbe5c8
    environment:
      IMGPROXY_KEY: ${IMGPROXY_KEY:?Set IMGPROXY_KEY}
      IMGPROXY_SALT: ${IMGPROXY_SALT:?Set IMGPROXY_SALT}
      IMGPROXY_WORKERS: ${IMAGE_WORKER_CONCURRENCY:-2}
      IMGPROXY_REQUESTS_QUEUE_SIZE: "8"
      IMGPROXY_MAX_SRC_RESOLUTION: "40"
      IMGPROXY_DOWNLOAD_TIMEOUT: "30"
      IMGPROXY_ALLOWED_SOURCES: http://minio:9000/${S3_BUCKET:-storage}/
      IMGPROXY_ALLOW_PRIVATE_SOURCE_ADDRESSES: "true"
      IMGPROXY_STRIP_METADATA: "true"
      IMGPROXY_AUTO_ROTATE: "true"
      IMGPROXY_PNG_QUANTIZE: "false"
    depends_on:
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "imgproxy", "health"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  app:

volumes:
  postgres_data:
  minio_data:
  rabbitmq_data:
