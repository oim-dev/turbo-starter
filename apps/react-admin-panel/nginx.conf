server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), display-capture=()" always;
    add_header Cache-Control "no-cache" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1000;

    # Caddy направляет /api/* напрямую в Admin API, удаляя префикс /api.
    location = /api {
        return 404;
    }

    location ^~ /api/ {
        return 404;
    }

    # SPA fallback - all other routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Долгий кеш только для хешированных файлов Vite; отсутствующие файлы не заменяются HTML.
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=(), microphone=(), display-capture=()" always;
    }
}
